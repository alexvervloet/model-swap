name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The system under test is a separate public repo. actions/checkout
      # cannot write outside the workspace, so it lands here and the locator is
      # pointed at it rather than at the sibling path a local checkout uses.
      - uses: actions/checkout@v7
        with:
          repository: alexvervloet/knowledge-desk
          path: sut/knowledge-desk

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # One virtualenv, both dependency trees. See the README.
          pip install -r sut/knowledge-desk/requirements.txt
          pip install -e sut/knowledge-desk

      - name: Start the system under test's database
        run: docker compose -f sut/knowledge-desk/docker-compose.yml up -d db

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' knowledge-desk-pg 2>/dev/null || echo none)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "database never became healthy"
          docker compose -f sut/knowledge-desk/docker-compose.yml logs db
          exit 1

      - name: Create, migrate and load model-swap's own database
        env:
          KNOWLEDGE_DESK_PATH: ${{ github.workspace }}/sut/knowledge-desk
        # Not `knowledge_desk.migrate`: this project has its own database on the
        # same server, and the loader is what creates and migrates it. --mock
        # because CI has no keys; nothing here scores anything, and the loader
        # says loudly what the index is worth.
        run: python -m modelswap.load --mock

      - name: Preflight
        env:
          KNOWLEDGE_DESK_PATH: ${{ github.workspace }}/sut/knowledge-desk
        run: python check_setup.py

      - name: Tests
        env:
          KNOWLEDGE_DESK_PATH: ${{ github.workspace }}/sut/knowledge-desk
        # --cov turns on the coverage floor configured in pyproject.
        run: python -m pytest -q --cov

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the secret scan reads every commit, so a credential
          # added and reverted inside a branch is still caught.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install ruff==0.8.4 mypy==1.14.0 pip-audit==2.7.3
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Scan for secrets
        # A hard gate: a committed credential is not something to look at later.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact --no-banner .
      - name: Audit dependencies
        # Advisory, matching the sibling repos: a new CVE in a pinned dep should
        # be visible without blocking unrelated work.
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --strict
