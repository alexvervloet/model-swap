# Answerable from one document, usually one passage. The floor: a candidate that
# cannot do these is not worth measuring on anything harder.

[[question]]
id = "single-adult-fare-kilmore"
text = "How much is an adult foot passenger ticket to Kilmore?"
expect = "answerable"
sources = ["03-fares-and-tickets"]
notes = "£9.40. A plain lookup with an exact number to get wrong."

[[question]]
id = "single-ashcombe-duration"
text = "How long does the Ashcombe crossing take?"
