[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-swap"
version = "0.0.1"
description = "Measure what a model migration costs, on a real app"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["modelswap"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sut: needs the sibling knowledge-desk checkout and its database",
    "paid: spends money against a real provider; never runs in CI",
]

[tool.coverage.run]
source = ["modelswap"]
# A developer probe for authoring questions, not part of what gets measured.
# Counting it only invites tests written for the metric rather than for the
# code, which is the argument knowledge-desk makes about its own bench.py.
omit = ["modelswap/probe.py"]

[tool.coverage.report]
# The argument-parsing wrappers are one line of dispatch each and exercising
# them proves nothing the module's own tests do not.
exclude_also = [
    "def main\\(\\) -> int:",
    "if __name__ == .__main__.:",
]
# Raised as each milestone's orchestration gets covered. Currently short of the
# paid paths: generation, judging and retrieval verification all need either a
# database or an API key, and are exercised by running them rather than by a
# test. A floor that was never raised is a floor nobody is using.
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "S",        # flake8-bandit
]
ignore = [
    "E501",  # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
# No python_version pin: it must match the interpreter in use. See the same
# note in knowledge-desk, which learned it the hard way.
files = ["modelswap"]
ignore_missing_imports = true
strict = true
